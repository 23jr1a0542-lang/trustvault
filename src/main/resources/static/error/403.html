
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied | TrustVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #202b3c;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            text-align: center;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000012;
        }

        h1 {
            color: #183b70;
            margin-bottom: 12px;
        }

        .code {
            color: #c62828;
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
        }

        p {
            line-height: 1.6;
            color: #555;
        }

        a {
            display: inline-block;
            margin: 10px 5px 0;
            padding: 12px 18px;
            border-radius: 7px;
            background: #183b70;
            color: white;
            text-decoration: none;
        }

        a:hover {
            background: #3459d5;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>TrustVault</h1>
        <div class="code">403</div>
        <h2>Access Denied</h2>

        <p>
            You do not have permission to access this page.
            Only an authorized, active administrator can view audit logs.
        </p>


        <a href="/">Home</a>
    </main>
</body>
</html>
