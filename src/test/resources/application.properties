# In-memory H2 configuration for automated tests (MySQL mode)
spring.application.name=trustVault-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test initial credentials
admin.initial-password=testAdminPassword123
viewer.initial-password=testViewerPassword123

# Document storage directory for test isolation
trustvault.storage-dir=target/test-trustvault-files
